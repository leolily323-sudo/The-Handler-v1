name: Handler v1 tests

on:
  push:
    paths:
      - "Handlerv1/handler_v1/**"
      - "Handlerv1/pyproject.toml"
      - "examples/**"
      - ".github/workflows/handler-tests.yml"
  pull_request:
    paths:
      - "Handlerv1/handler_v1/**"
      - "Handlerv1/pyproject.toml"
      - "examples/**"
      - ".github/workflows/handler-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handler-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Handlerv1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -e ".[test]" build
      - name: Validate wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Run Handler v1 lifecycle and regression tests
        run: python -m pytest handler_v1/tests/ -q
      - name: Verify public local demo
        run: python ../examples/local_demo.py
