[project]
name = "handler_v1"
version = "0.1.0"
description = "Deterministic Control Plane & Safety Gateway for AI Agents (Handler v1)"
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true
