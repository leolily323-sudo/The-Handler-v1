[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handler-v1-control-plane"
version = "0.1.0"
description = "A deterministic, fail-closed execution boundary for AI-proposed commands"
readme = {text = "Deterministic command execution boundary for AI agent integrations. See the repository README for setup, architecture, and limitations.", content-type = "text/plain"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "leolily323-sudo"}]
keywords = ["ai-agents", "authorization", "idempotency", "control-plane"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["handler_v1*"]
exclude = ["handler_v1.tests*"]

[tool.pytest.ini_options]
testpaths = ["handler_v1/tests"]
